# Standalone USB-only trackpad test device.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_OFF=y
CONFIG_HWINFO=y
# Swipe/zoom gestures run key behaviors (&kp) on the input thread; Zephyr's 512-byte default
# stack overflows there (device froze on the first swipe).
CONFIG_INPUT_THREAD_STACK_SIZE=2048
