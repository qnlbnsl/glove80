# Trackpad split peripheral: finger frames go to the dongle over BLE (touchpad mode).
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_INPUT=y
CONFIG_HWINFO=y
CONFIG_PTP_SPLIT_PERIPHERAL=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# Marks this peripheral as a trackpad for the dongle (CONFIG_PTP_SPLIT_PAD_APPEARANCE).
CONFIG_BT_DEVICE_APPEARANCE=965
