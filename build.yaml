# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "glove80_lh", "glove80_rh" ]

include:
  - board: xiao_ble//zmk
    shield: glove80_dongle prospector_adapter
    cmake-args: -DCONFIG_EXPERIMENTAL_RGB_LAYER=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_RGB_UNDERGLOW_FORWARD=y -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80 -DCONFIG_PROSPECTOR_STATUS_SCREEN_GLOVE80=y -DCONFIG_PROSPECTOR_LAYER_ROLLER_HIDE_UNNAMED=y -DCONFIG_PROSPECTOR_BATTERY_SWAP=y -DCONFIG_PROSPECTOR_BATTERY_CELLS=2 -DCONFIG_ZMK_HID_INDICATORS=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT_BLE=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4 -DCONFIG_BT_MAX_CONN=6 -DCONFIG_PTP_USB=y -DCONFIG_PTP_USB_PADS=1 -DCONFIG_PTP_SPLIT_CENTRAL=y -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y -DCONFIG_USB_HID_DEVICE_COUNT=2 -DCONFIG_HID_INTERRUPT_EP_MPS=64 -DCONFIG_BT_MAX_PAIRED=6 -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    #snippet: zmk-usb-logging

  - board: glove80_lh
    cmake-args: -DCONFIG_EXPERIMENTAL_RGB_LAYER=y -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=y -DCONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4 -DCONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y -DCONFIG_ZMK_IDLE_TIMEOUT=10000 -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_HID_INDICATORS=y -DCONFIG_ZMK_BLE=y

  - board: glove80_rh
    cmake-args: -DCONFIG_EXPERIMENTAL_RGB_LAYER=y -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=y -DCONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4 -DCONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y -DCONFIG_ZMK_IDLE_TIMEOUT=10000 -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_HID_INDICATORS=y -DCONFIG_ZMK_BLE=y

  - board: glove80_lh
    shield: settings_reset
    cmake-args: -DCONFIG_BT_MAX_PAIRED=0 -DCONFIG_EXPERIMENTAL_RGB_LAYER=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_SPLIT=n

  - board: glove80_rh
    shield: settings_reset
    cmake-args: -DCONFIG_BT_MAX_PAIRED=0 -DCONFIG_EXPERIMENTAL_RGB_LAYER=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_SPLIT=n

  - board: xiao_ble//zmk
    shield: settings_reset
    cmake-args: -DCONFIG_BT_MAX_PAIRED=0 -DCONFIG_EXPERIMENTAL_RGB_LAYER=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_SPLIT=n

  # Debug builds: same as above plus USB logging (read with: tio /dev/ttyACM0)
  - board: xiao_ble//zmk
    shield: glove80_dongle prospector_adapter
    cmake-args: -DCONFIG_EXPERIMENTAL_RGB_LAYER=n -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_RGB_UNDERGLOW_FORWARD=y -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80 -DCONFIG_PROSPECTOR_STATUS_SCREEN_GLOVE80=y -DCONFIG_PROSPECTOR_LAYER_ROLLER_HIDE_UNNAMED=y -DCONFIG_PROSPECTOR_BATTERY_SWAP=y -DCONFIG_PROSPECTOR_BATTERY_CELLS=2 -DCONFIG_ZMK_HID_INDICATORS=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT_BLE=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4 -DCONFIG_BT_MAX_CONN=6 -DCONFIG_PTP_USB=y -DCONFIG_PTP_USB_PADS=1 -DCONFIG_PTP_SPLIT_CENTRAL=y -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y -DCONFIG_USB_HID_DEVICE_COUNT=2 -DCONFIG_HID_INTERRUPT_EP_MPS=64 -DCONFIG_BT_MAX_PAIRED=6 -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
    snippet: zmk-usb-logging
    artifact-name: logging-glove80_dongle

  - board: glove80_rh
    cmake-args: -DCONFIG_EXPERIMENTAL_RGB_LAYER=y -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=y -DCONFIG_ZMK_RGB_UNDERGLOW_EFF_START=4 -DCONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y -DCONFIG_ZMK_IDLE_TIMEOUT=10000 -DCONFIG_ZMK_POINTING=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_HID_INDICATORS=y -DCONFIG_ZMK_BLE=y
    snippet: zmk-usb-logging
    artifact-name: logging-glove80_rh

  # Trackpad: TPS65 on a XIAO nRF52840 as a split peripheral (touchpad frames to the dongle)
  # tps65_xiao (standalone USB trackpad) is no longer built; tps65_pad reuses its overlay.
  # Trackpad split peripherals: same shield, side picked by CONFIG_PTP_SPLIT_PAD_SIDE_*.
  # Left pad XIAO (094A41E990F39E63) is on the old 4-wire harness (no RDY/NRST):
  # tps65_4wire makes the driver poll.
  - board: xiao_ble//zmk
    shield: tps65_pad tps65_4wire
    cmake-args: -DCONFIG_PTP_SPLIT_PAD_SIDE_LEFT=y
    artifact-name: tps65_pad_lh
  # Right pad XIAO (AA9365CAC6EE74D0) has RDY on D2 and NRST on D3 (6 wires).
  - board: xiao_ble//zmk
    shield: tps65_pad
    cmake-args: -DCONFIG_PTP_SPLIT_PAD_SIDE_RIGHT=y
    artifact-name: tps65_pad_rh
  - board: xiao_ble//zmk
    shield: tps65_pad
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_PTP_SPLIT_PAD_SIDE_RIGHT=y
    artifact-name: logging-tps65_pad_rh
